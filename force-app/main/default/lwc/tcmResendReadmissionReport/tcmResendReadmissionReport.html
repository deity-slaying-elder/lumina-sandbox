<template>
    <div class="resend">
        <template lwc:if={loading}>
            <div class="resend__loading">
                <lightning-spinner alternative-text="Checking the report" size="small"></lightning-spinner>
            </div>
        </template>

        <template lwc:else>
            <template lwc:if={error}>
                <div class="slds-m-bottom_small" role="alert">
                    <lightning-icon
                        icon-name="utility:error"
                        variant="error"
                        size="x-small"
                        class="slds-m-right_x-small">
                    </lightning-icon>
                    <span class="slds-text-color_error">{error}</span>
                </div>
            </template>

            <template lwc:if={blocked}>
                <div role="status">
                    <lightning-icon
                        icon-name="utility:info_alt"
                        size="x-small"
                        class="slds-m-right_x-small">
                    </lightning-icon>
                    <span>{result.blockedReason}</span>
                </div>
            </template>

            <template lwc:if={showDetail}>
                <dl class="resend__facts slds-m-bottom_medium">
                    <dt class="slds-text-color_weak">Facility</dt>
                    <dd>{result.facilityName}</dd>
                    <dt class="slds-text-color_weak">Report window</dt>
                    <dd>{result.windowLabel}</dd>
                    <dt class="slds-text-color_weak">Admissions</dt>
                    <dd>{result.rowCount}</dd>
                </dl>

                <p class="slds-text-title_caps resend__caps">
                    Recipients, one link each
                </p>
                <ul class="resend__list slds-m-bottom_small">
                    <template for:each={recipientRows} for:item="row">
                        <li key={row.key} class="resend__row">
                            <div class="resend__who">
                                <span class="slds-truncate" title={row.email}>{row.email}</span>
                                <span class="slds-text-body_small slds-text-color_weak">{row.role}</span>
                            </div>
                            <div class="resend__state">
                                <template lwc:if={row.expiresAt}>
                                    <span class="slds-text-body_small slds-text-color_weak">
                                        Expires {row.expiresAt}
                                    </span>
                                </template>
                                <template lwc:if={row.statusLabel}>
                                    <span class={row.statusClass}>{row.statusLabel}</span>
                                </template>
                            </div>
                        </li>
                    </template>
                </ul>

                <p class="slds-text-body_small slds-text-color_weak">{expiryLabel}</p>
                <p class="slds-text-body_small slds-text-color_weak">
                    The email carries a count and a link only. No patient information is included.
                </p>

                <template lwc:if={result.redirected}>
                    <div class="slds-m-top_x-small" role="status">
                        <lightning-icon
                            icon-name="utility:warning"
                            variant="warning"
                            size="x-small"
                            class="slds-m-right_x-small">
                        </lightning-icon>
                        <span class="slds-text-body_small">
                            Sandbox org. Delivery is redirected to the configured testers, not the
                            facility.
                        </span>
                    </div>
                </template>

                <template lwc:if={hasProblems}>
                    <ul class="slds-m-top_x-small slds-list_dotted">
                        <template for:each={result.problems} for:item="problem">
                            <li key={problem} class="slds-text-body_small slds-text-color_error">
                                {problem}
                            </li>
                        </template>
                    </ul>
                </template>
            </template>

            <div class="resend__footer slds-m-top_medium">
                <template lwc:if={ready}>
                    <lightning-button
                        variant="neutral"
                        label="Cancel"
                        onclick={handleClose}
                        class="slds-m-right_x-small">
                    </lightning-button>
                    <lightning-button
                        variant="brand"
                        label="Send new link"
                        onclick={handleSend}
                        disabled={working}>
                    </lightning-button>
                </template>
                <template lwc:else>
                    <lightning-button variant="neutral" label="Close" onclick={handleClose}>
                    </lightning-button>
                </template>
            </div>

            <template lwc:if={working}>
                <div class="resend__loading">
                    <lightning-spinner alternative-text="Sending" size="small"></lightning-spinner>
                </div>
            </template>
        </template>
    </div>
</template>
